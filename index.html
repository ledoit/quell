<!DOCTYPE html>
<html lang="en" data-look="soft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Quell — OLL and PLL." />
    <meta name="theme-color" content="#f3f2ee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quell" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Quell</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("quell-look") === "hard") {
          document.documentElement.dataset.look = "hard";
          document.querySelector('meta[name="theme-color"]').content = "#fbfbf8";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app" data-look="soft">
      <header>
        <button type="button" class="set on" data-set="oll">OLL</button>
        <button type="button" class="set" data-set="pll">PLL</button>
        <span class="grow"></span>
        <button type="button" id="back" class="back" hidden></button>
        <button
          type="button"
          id="menu-btn"
          aria-label="Look"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="menu"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
        </button>
        <div id="menu" hidden role="menu" aria-label="Look">
          <button type="button" role="menuitem" data-look="soft" class="on">Soft</button>
          <button type="button" role="menuitem" data-look="hard">Hard</button>
        </div>
      </header>
      <main id="grid"></main>
      <div id="alg" hidden>
        <div class="alg-card">
          <div class="alg-bar">
            <p class="who"></p>
            <button type="button" class="close">Close</button>
          </div>
          <p class="moves"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
