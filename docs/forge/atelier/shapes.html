<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shapes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@440;560&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#f3f2ee; --ink:#1c1b19; --quiet:#a09d96; --yellow:#f5c518; --empty:#e3e1d9; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Outfit, sans-serif; }
      .app { display: none; height: 100dvh; overflow: hidden; grid-template-rows: 3.1rem 1fr; }
      .app.show { display: grid; }
      header { display: flex; align-items: flex-end; gap: 1.15rem; padding: 0.85rem 1.25rem 0.35rem; min-height: 0; }
      header button { border: 0; background: none; font: inherit; cursor: pointer; }
      .set { font-size: 1.05rem; font-weight: 560; color: var(--quiet); padding-bottom: 0.15rem; border-bottom: 2px solid transparent; }
      .set.on { color: var(--ink); border-bottom-color: var(--ink); }
      .back { margin-left: auto; font-size: 1.05rem; font-weight: 560; }
      .grid { min-height: 0; display: grid; padding: 0.45rem 0.7rem 0.75rem; gap: 0.15rem; }
      .g16 { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }
      .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
      .cell {
        container-type: size;
        border: 0; background: transparent; font: inherit; color: var(--ink);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.5cqh; min-width: 0; min-height: 0; cursor: pointer;
      }
      .face { width: min(78cqw, 70cqh); aspect-ratio: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7%; }
      .g4 .face { width: min(52cqw, 64cqh); }
      .face i { border-radius: 16%; background: var(--empty); }
      .face i.y { background: var(--yellow); }
      .cell span { font-size: min(5.2cqh, 1rem); font-weight: 440; color: #3c3a36; line-height: 1; }
      .g4 .cell span { font-size: min(4.2cqh, 1.35rem); font-weight: 560; }
      .g1 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
      .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
      .g1 .face, .g2 .face { width: min(46cqw, 62cqh); }
      .face.perm { position: relative; gap: 6%; }
      .face.perm svg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--ink); }
      .blank { cursor: default; }
      .alg {
        position: fixed; inset: 0; z-index: 5; color: var(--ink);
        background: color-mix(in srgb, var(--ink) 32%, transparent);
        display: grid; place-items: center; cursor: pointer; overflow: hidden;
      }
      .alg[hidden] { display: none; }
      .alg-card {
        position: relative; cursor: default; background: var(--bg); text-align: center;
        width: min(92vw, 76rem); border-radius: 1.75rem;
        box-shadow: 0 1.4rem 3.75rem rgba(28, 27, 25, 0.28);
        padding: 2.4rem 2.75rem 2.2rem;
      }
      .alg .who {
        color: var(--quiet); font-size: 1.05rem; font-weight: 560; margin-bottom: 0.4rem;
      }
      .alg .moves {
        text-align: center; font-weight: 560; letter-spacing: -0.045em; line-height: 1.08;
      }
    </style>
  </head>
  <body>
    <section class="app" id="patterns"></section>
    <section class="app" id="cases"></section>
    <section class="app" id="pll"></section>
    <section class="app" id="letter"></section>
    <div class="alg" id="alg" hidden>
      <div class="alg-card">
        <p class="who"></p>
        <p class="moves"></p>
      </div>
    </div>
    <script src="/shared.js"></script>
    <script>
      const oll = [
        ["Dot","000010000"],["Line","000111000"],["Cross","010111010"],["Corners","101010101"],
        ["Small L","010110000"],["Big L","110110000"],["Lightning","001110100"],["Z","110010011"],
        ["Fish","111110000"],["Knight","100010010"],["Awkward","100110001"],["W","101111010"],
        ["P","011110000"],["T","010111000"],["C","100110111"],["Square","111111000"],
      ];
      const { permFace, pll, oll: ollCases, letters } = window.QuellAtelier;
      const face = (bits) => `<div class="face">${[...bits].map((b) => `<i class="${b === "1" ? "y" : ""}"></i>`).join("")}</div>`;
      const head = (active, back) => `<header>
        <button class="set ${active === "oll" ? "on" : ""}" type="button">OLL</button>
        <button class="set ${active === "pll" ? "on" : ""}" type="button">PLL</button>
        ${back ? `<button class="back" type="button">${back}</button>` : ""}
      </header>`;
      const gridFor = (n) => (n <= 1 ? "g1" : n === 2 ? "g2" : "g4");
      const ofLetter = (letter) => pll.filter((c) => c.letter === letter);
      const findAlg = (key) => pll.find((c) => c.id.toLowerCase() === key) || ollCases.find((c) => c.id === key);
      document.getElementById("patterns").innerHTML = head("oll") + `<div class="grid g16">${oll.map(([n, b]) => `<button class="cell" type="button">${face(b)}<span>${n}</span></button>`).join("")}</div>`;
      document.getElementById("cases").innerHTML = head("oll", "Lightning") + `<div class="grid g4">${ollCases.map((c) => `<button class="cell" type="button" data-alg="${c.id}">${face(c.bits)}<span>${c.label}</span></button>`).join("")}</div>`;
      document.getElementById("pll").innerHTML = head("pll") + `<div class="grid g16">${letters.map((letter) => {
        const sample = pll.find((c) => c.letter === letter);
        return `<button class="cell" type="button" data-letter="${letter}">${permFace(sample.edges, sample.corners, "L" + letter)}<span>${letter}</span></button>`;
      }).join("")}${"<div class='cell blank'></div>".repeat(3)}</div>`;
      const renderLetter = (letter) => {
        const cases = ofLetter(letter);
        document.getElementById("letter").innerHTML = head("pll", letter) + `<div class="grid ${gridFor(cases.length)}">${cases.map((c) => `<button class="cell" type="button" data-alg="${c.id}">${permFace(c.edges, c.corners, "C" + c.id)}<span class="id">${c.id}</span></button>`).join("")}</div>`;
      };
      const fit = (el) => {
        const box = document.getElementById("alg");
        let size = Math.min(box.clientWidth * 0.078, box.clientHeight * 0.2);
        el.style.fontSize = `${size}px`;
        const maxH = box.clientHeight * 0.62;
        while (size > 18 && el.scrollHeight > maxH) {
          size *= 0.9;
          el.style.fontSize = `${size}px`;
        }
      };
      const show = () => {
        const hash = location.hash.slice(1);
        const alg = document.getElementById("alg");
        alg.hidden = true;
        let id = "patterns";
        if (hash === "cases") id = "cases";
        else if (hash === "pll") id = "pll";
        else if (hash.startsWith("pll-")) {
          renderLetter(decodeURIComponent(hash.slice(4)));
          id = "letter";
        } else if (hash.startsWith("alg-")) {
          const item = findAlg(hash.slice(4));
          if (item) {
            if (item.letter) {
              renderLetter(item.letter);
              id = "letter";
            } else id = "cases";
            alg.querySelector(".who").textContent = item.label || item.id;
            const moves = alg.querySelector(".moves");
            moves.textContent = item.moves;
            alg.hidden = false;
            requestAnimationFrame(() => fit(moves));
          }
        }
        document.querySelectorAll(".app").forEach((el) => el.classList.toggle("show", el.id === id));
      };
      show();
      addEventListener("hashchange", show);
      addEventListener("resize", () => {
        const moves = document.querySelector("#alg .moves");
        if (moves && !document.getElementById("alg").hidden) fit(moves);
      });
      document.body.addEventListener("click", (event) => {
        if (event.target.closest("#alg")) {
          if (event.target.closest(".alg-card") && !event.target.closest(".close")) return;
          const item = findAlg(location.hash.slice(5));
          location.hash = item && item.letter ? `pll-${item.letter}` : "cases";
          return;
        }
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.alg) {
          location.hash = `alg-${button.dataset.alg.toLowerCase()}`;
          return;
        }
        if (button.dataset.letter) {
          location.hash = `pll-${button.dataset.letter}`;
          return;
        }
        const label = button.textContent.trim();
        if (label === "OLL" || (button.classList.contains("back") && button.closest("#cases"))) location.hash = "";
        else if (button.classList.contains("back")) location.hash = "pll";
        else if (label === "PLL") location.hash = "pll";
        else if (label === "Lightning" && button.closest("#patterns")) location.hash = "cases";
      });
    </script>
  </body>
</html>
