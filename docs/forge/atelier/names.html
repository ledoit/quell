<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Names</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#fbfbfa; --ink:#141414; --quiet:#9b9b9b; --line:#eeeae4; --yellow:#f5c518; --empty:#eceae3; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Sora, sans-serif; }
      .app { display: none; height: 100dvh; overflow: hidden; grid-template-rows: 3.4rem 1fr; }
      .app.show { display: grid; }
      header { display: flex; align-items: center; gap: 1.35rem; padding: 0 1.5rem; }
      header button { border: 0; background: none; font: inherit; cursor: pointer; color: var(--quiet); font-weight: 600; font-size: 1.15rem; letter-spacing: -0.03em; }
      header .on { color: var(--ink); }
      .back { margin-left: auto; color: var(--ink); }
      .grid { min-height: 0; display: grid; }
      .g16 { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }
      .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
      .cell {
        container-type: size;
        border: 0; border-top: 1px solid var(--line); background: transparent;
        font: inherit; color: var(--ink); text-align: left; cursor: pointer;
        display: flex; align-items: center; gap: 3cqw; padding: 0 4cqw; min-width: 0; min-height: 0;
      }
      .g16 .cell:nth-child(-n + 4), .g4 .cell:nth-child(-n + 2) { border-top: 0; }
      .face { width: min(22cqw, 46cqh); aspect-ratio: 1; flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8%; }
      .g4 .face { width: min(16cqw, 36cqh); }
      .face i { border-radius: 2px; background: var(--empty); }
      .face i.y { background: var(--yellow); }
      .cell b { font-weight: 600; letter-spacing: -0.045em; line-height: 1; font-size: clamp(1.6rem, 2.8vw, 2.55rem); white-space: nowrap; }
      .g4 .cell b { font-size: clamp(2.4rem, 4.6vw, 4.2rem); }
      .letter { font-size: clamp(3rem, 6vw, 5.5rem); font-weight: 600; letter-spacing: -0.05em; }
    </style>
  </head>
  <body>
    <section class="app" id="patterns"></section>
    <section class="app" id="cases"></section>
    <section class="app" id="pll"></section>
    <script>
      const oll = [
        ["Dot","000010000"],["Line","000111000"],["Cross","010111010"],["Corners","101010101"],
        ["Small L","010110000"],["Big L","110110000"],["Lightning","001110100"],["Z","110010011"],
        ["Fish","111110000"],["Knight","100010010"],["Awkward","100110001"],["W","101111010"],
        ["P","011110000"],["T","010111000"],["C","100110111"],["Square","111111000"],
      ];
      const lightning = [["OLL 7","001110100"],["OLL 8","001011001"],["OLL 11","001110010"],["OLL 12","010111001"]];
      const pll = ["A","E","F","G","H","J","N","R","T","U","V","Y","Z"];
      const face = (bits) => `<div class="face">${[...bits].map((b) => `<i class="${b === "1" ? "y" : ""}"></i>`).join("")}</div>`;
      const head = (active, back) => `<header>
        <button class="${active === "oll" ? "on" : ""}" type="button">OLL</button>
        <button class="${active === "pll" ? "on" : ""}" type="button">PLL</button>
        ${back ? `<button class="back" type="button">${back}</button>` : ""}
      </header>`;
      document.getElementById("patterns").innerHTML = head("oll") + `<div class="grid g16">${oll.map(([n,b]) => `<button class="cell" type="button">${face(b)}<b>${n}</b></button>`).join("")}</div>`;
      document.getElementById("cases").innerHTML = head("oll","Lightning") + `<div class="grid g4">${lightning.map(([n,b]) => `<button class="cell" type="button">${face(b)}<b>${n}</b></button>`).join("")}</div>`;
      document.getElementById("pll").innerHTML = head("pll") + `<div class="grid g16">${pll.map((n) => `<button class="cell" type="button"><b class="letter">${n}</b></button>`).join("")}</div>`;
      const show = () => {
        const id = location.hash.slice(1) || "patterns";
        document.querySelectorAll(".app").forEach((el) => el.classList.toggle("show", el.id === id));
      };
      show();
      addEventListener("hashchange", show);
      document.body.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        const label = button.textContent.trim();
        if (label === "OLL" || button.classList.contains("back")) location.hash = "";
        else if (label === "PLL") location.hash = "pll";
        else if (label === "Lightning" && button.closest("#patterns")) location.hash = "cases";
      });
    </script>
  </body>
</html>
